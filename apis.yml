aid: kabum
name: KaBum!
description: >-
  KaBuM! is the largest e-commerce retailer of technology, computer hardware,
  electronics, and games in Latin America, headquartered in Limeira, Brazil and
  part of the Magalu (Magazine Luiza) group. Beyond its consumer storefront,
  KaBuM! operates a third-party seller marketplace on the Mirakl platform and
  publishes an integration guide for sellers and integrators to connect their
  ERP/OMS to the marketplace via a REST API — managing product catalog,
  attribute mapping, offers (price/stock), order retrieval, shipping carriers,
  document uploads, and tracking/ship confirmation. Authentication is API-key
  based, write operations are expected to be idempotent, and integrations poll
  asynchronous import jobs by id. This profile was added to the API Evangelist
  network from a VC portfolio lead and enriched from KaBuM!'s public integration
  documentation.
