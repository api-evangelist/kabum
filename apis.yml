apis:
- name: KaBuM! Marketplace Seller Integration API
  description: >-
    REST API for third-party sellers and integrators to connect to the KaBuM!
    marketplace (operated on the Mirakl platform). Covers category hierarchies,
    product attribute mapping, product and offer imports, order retrieval,
    custom fields, document uploads, shipping carriers, and tracking/ship
    confirmation. Uses API-key authentication and asynchronous import jobs with
    id-based polling; write operations should be idempotent.
